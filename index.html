<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="De Volta Para o Vinil - Catálogo e acervo musical com consumo de API externa do GitHub" />
  <title>De Volta Para o Vinil</title>


  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />


  <link rel="stylesheet" href="./src/app.css" />

  <style>
    :root {
      --bg-main: #0c0e14;
      --bg-card: rgba(22, 27, 38, 0.75);
      --bg-card-hover: rgba(30, 38, 56, 0.95);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --gold-accent: #f59e0b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
    }
  </style>
</head>

<body>
  <div class="app-wrapper">

    <header class="header-hero">
      <span class="hero-pill">🎵 Acervo Oficial de Vinis</span>
      <h1 class="hero-title">De Volta Para o Vinil</h1>
      <p class="hero-subtitle">
        Catálogo completo carregado em tempo real a partir do JSON no GitHub.
      </p>


      <div class="stats-bar" id="statsBar" style="display: none;">
        <div class="stat-item">
          <span>Discos no Acervo:</span>
          <strong id="totalDiscos">0</strong>
        </div>
        <div class="stat-item">
          <span>Artistas/Bandas:</span>
          <strong id="totalBandas">0</strong>
        </div>
      </div>
    </header>


    <section class="search-section">
      <div class="search-input-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Buscar por banda, álbum, gênero, gravadora ou ano (ex: AC/DC, Samba, 1980)..." />
        <button id="clearBtn" class="clear-btn" title="Limpar busca" style="display: none;">
          ✕
        </button>
      </div>


      <div class="filters-row" id="filtersRow" style="display: none;">
        <span class="filter-label">Gênero:</span>
        <div id="genreTagsContainer" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
      </div>
    </section>


    <div id="errorBanner" class="error-banner" style="display: none;"></div>

    <div id="loadingStatus" class="status-container">
      <div class="loader-spinner"></div>
      <p>Carregando catálogo de vinis do GitHub...</p>
    </div>


    <div id="resultsInfo" class="results-info" style="display: none;">
      <span class="results-count" id="resultsCount"></span>
    </div>


    <div id="emptyStatus" class="status-container" style="display: none;">
      <p style="font-size: 1.2rem; margin-bottom: 8px;">Nenhum vinil encontrado.</p>
      <p style="color: var(--text-muted);">Tente pesquisar por outro artista, gênero ou ano.</p>
    </div>


    <div id="gridCards" class="grid-cards"></div>


    <div id="loadMoreContainer" class="load-more-container" style="display: none;">
      <button id="loadMoreBtn" class="load-more-btn">
        Carregar mais discos ↓
      </button>
    </div>
  </div>


  <script>
    const GITHUB_RAW_URL =
      "https://gist.githubusercontent.com/CarolOliveira86/dcdf97a3e6fab1be5e86aeccf575156e/raw/160a1891e4846bf93c0dc5a2b18ed45f7e06fd25/gistfile1.txt";

    const ITEMS_PER_PAGE = 24;
    let todosVinis = [];
    let vinisFiltrados = [];
    let generoSelecionado = "Todos";
    let termoBusca = "";
    let limiteExibicao = ITEMS_PER_PAGE;


    const loadingStatus = document.getElementById("loadingStatus");
    const errorBanner = document.getElementById("errorBanner");
    const statsBar = document.getElementById("statsBar");
    const totalDiscosEl = document.getElementById("totalDiscos");
    const totalBandasEl = document.getElementById("totalBandas");
    const searchInput = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearBtn");
    const filtersRow = document.getElementById("filtersRow");
    const genreTagsContainer = document.getElementById("genreTagsContainer");
    const resultsInfo = document.getElementById("resultsInfo");
    const resultsCountEl = document.getElementById("resultsCount");
    const emptyStatus = document.getElementById("emptyStatus");
    const gridCards = document.getElementById("gridCards");
    const loadMoreContainer = document.getElementById("loadMoreContainer");
    const loadMoreBtn = document.getElementById("loadMoreBtn");


    async function carregarDados() {
      try {
        loadingStatus.style.display = "block";
        errorBanner.style.display = "none";

        const response = await fetch(GITHUB_RAW_URL);
        if (!response.ok) {
          throw new Error(`Erro HTTP: ${response.status} (${response.statusText})`);
        }

        const data = await response.json();
        todosVinis = Array.isArray(data) ? data : [];


        const bandasUnicas = new Set(todosVinis.map((v) => v.BANDA).filter(Boolean));
        totalDiscosEl.textContent = todosVinis.length.toLocaleString("pt-BR");
        totalBandasEl.textContent = bandasUnicas.size.toLocaleString("pt-BR");
        statsBar.style.display = "flex";


        criarBotoesGeneros();

        aplicarFiltros();
      } catch (err) {
        errorBanner.textContent = "⚠️ " + (err.message || "Falha ao carregar o JSON do GitHub.");
        errorBanner.style.display = "block";
      } finally {
        loadingStatus.style.display = "none";
      }
    }


    function criarBotoesGeneros() {
      const mapaGeneros = {};
      todosVinis.forEach((item) => {
        if (item.GENERO && typeof item.GENERO === "string") {
          const g = item.GENERO.trim();
          mapaGeneros[g] = (mapaGeneros[g] || 0) + 1;
        }
      });

      const principais = Object.entries(mapaGeneros)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 7)
        .map(([nome]) => nome);

      const generos = ["Todos", ...principais];
      genreTagsContainer.innerHTML = "";

      generos.forEach((gen) => {
        const btn = document.createElement("button");
        btn.className = `genre-tag ${gen === generoSelecionado ? "active" : ""}`;
        btn.textContent = gen === "Todos" ? `Todos (${todosVinis.length})` : gen;
        btn.onclick = () => {
          generoSelecionado = gen;
          document.querySelectorAll(".genre-tag").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          limiteExibicao = ITEMS_PER_PAGE;
          aplicarFiltros();
        };
        genreTagsContainer.appendChild(btn);
      });

      filtersRow.style.display = "flex";
    }


    function aplicarFiltros() {
      const termo = termoBusca.toLowerCase().trim();

      vinisFiltrados = todosVinis.filter((item) => {
        if (generoSelecionado !== "Todos" && item.GENERO !== generoSelecionado) {
          return false;
        }

        if (!termo) return true;

        const banda = String(item.BANDA || "").toLowerCase();
        const album = String(item.ALBUM || "").toLowerCase();
        const genero = String(item.GENERO || "").toLowerCase();
        const gravadora = String(item.GRAVADORA || "").toLowerCase();
        const ano = String(item["ANO DO VINIL"] || "").toLowerCase();

        return (
          banda.includes(termo) ||
          album.includes(termo) ||
          genero.includes(termo) ||
          gravadora.includes(termo) ||
          ano.includes(termo)
        );
      });

      renderizarCards();
    }


    function renderizarCards() {
      gridCards.innerHTML = "";

      if (vinisFiltrados.length === 0) {
        resultsInfo.style.display = "none";
        emptyStatus.style.display = "block";
        loadMoreContainer.style.display = "none";
        return;
      }

      emptyStatus.style.display = "none";
      resultsInfo.style.display = "flex";

      const visiveis = vinisFiltrados.slice(0, limiteExibicao);
      resultsCountEl.innerHTML = `Exibindo <strong>${visiveis.length}</strong> de <strong>${vinisFiltrados.length}</strong> discos encontrados`;

      visiveis.forEach((item, index) => {
        const banda = item.BANDA || "Artista Desconhecido";
        const album = item.ALBUM || "Sem título";
        const ano = item["ANO DO VINIL"] || "N/A";
        const genero = item.GENERO || "Diversos";
        const gravadora = item.GRAVADORA || "Independente";
        const valor = item.VALOR || "R$ --";
        const local = item.LOCAL || "Acervo";
        const vendedor = item.VENDEDOR || "Coleção";
        const qtd = item.QUANTIDADE !== undefined ? item.QUANTIDADE : 1;

        const card = document.createElement("article");
        card.className = "vinyl-card";
        card.innerHTML = `
            <div class="card-top">
              <div class="vinyl-disc-art">
                <div class="vinyl-center-hole"></div>
              </div>
              <div class="badges-group">
                <span class="badge-year">${ano}</span>
                <span class="badge-genre" title="${genero}">${genero}</span>
              </div>
            </div>

            <div class="card-content">
              <h2 class="band-name" title="${banda}">${banda}</h2>
              <h3 class="album-name" title="${album}">${album}</h3>

              <div class="spec-list">
                <div class="spec-item">
                  <span class="spec-label">Gravadora</span>
                  <span class="spec-value" title="${gravadora}">${gravadora}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Local</span>
                  <span class="spec-value" title="${local}">${local}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Origem</span>
                  <span class="spec-value" title="${vendedor}">${vendedor}</span>
                </div>
                <div class="spec-item">
                  <span class="spec-label">Qtd</span>
                  <span class="spec-value">${qtd} un.</span>
                </div>
              </div>

              <div class="card-footer">
                <span class="price-tag">${valor}</span>
                <span class="seller-tag">📍 ${local}</span>
              </div>
            </div>
          `;

        gridCards.appendChild(card);
      });


      if (limiteExibicao < vinisFiltrados.length) {
        loadMoreContainer.style.display = "block";
        const restantes = vinisFiltrados.length - limiteExibicao;
        loadMoreBtn.textContent = `Carregar mais discos (${restantes} restantes) ↓`;
      } else {
        loadMoreContainer.style.display = "none";
      }
    }


    searchInput.addEventListener("input", (e) => {
      termoBusca = e.target.value;
      clearBtn.style.display = termoBusca ? "flex" : "none";
      limiteExibicao = ITEMS_PER_PAGE;
      aplicarFiltros();
    });

    clearBtn.addEventListener("click", () => {
      searchInput.value = "";
      termoBusca = "";
      clearBtn.style.display = "none";
      limiteExibicao = ITEMS_PER_PAGE;
      aplicarFiltros();
      searchInput.focus();
    });

    loadMoreBtn.addEventListener("click", () => {
      limiteExibicao += ITEMS_PER_PAGE;
      renderizarCards();
    });


    carregarDados();
  </script>
</body>

</html>
